<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>소울스트라이크 쿠폰 등록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟</text></svg>" />
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #6b7385;
    --line: #e2e5eb; --accent: #3a7afe; --ok: #1f9d55; --bad: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --card: #1d2027; --text: #e8eaf0; --muted: #9aa1b2;
            --line: #2d313a; --accent: #5b8fff; --ok: #3fbf74; --bad: #ef6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin-bottom: 14px; }
  textarea, input, select { width: 100%; font: inherit; color: inherit; background: transparent;
          border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  textarea { min-height: 72px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer;
           background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  .muted { color: var(--muted); font-size: 13px; }
  table.ids { width: 100%; border-collapse: collapse; margin-top: 8px; table-layout: fixed; }
  table.ids th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted);
                 padding: 4px 6px; border-bottom: 1px solid var(--line); }
  table.ids td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; word-break: break-all; }
  table.ids th.c-act, table.ids td.c-act { width: 64px; text-align: right; }
  table.ids td.cs { font-family: ui-monospace, monospace; font-size: 13px; white-space: nowrap; word-break: normal; }
  table.ids td.name b { font-weight: 600; }
  table.ids .edit { display: flex; gap: 6px; }
  table.ids .edit input { padding: 5px 8px; min-width: 0; }
  table.ids button { padding: 5px 10px; font-size: 13px; flex: 0 0 auto; }
  table.ids .empty { color: var(--muted); font-size: 13px; }
  .res { margin-top: 10px; font-size: 14px; }
  .res div { padding: 4px 0; border-bottom: 1px solid var(--line); word-break: break-all; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .hidden { display: none !important; }
  body:not(.admin) .admin-only { display: none !important; }
  body.admin .user-only { display: none !important; }
  .badge { font-size: 12px; font-weight: 600; color: var(--ok); }
  label.file { display: inline-block; }
</style>
</head>
<body>
<main>
  <h1>소울스트라이크 쿠폰 등록</h1>

  <section id="login" class="card">
    <h2>비밀번호</h2>
    <form id="loginForm" class="row">
      <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" />
      <button type="submit" style="flex:0 0 auto">들어가기</button>
    </form>
    <p id="loginMsg" class="muted"></p>
  </section>

  <div id="app" class="hidden">
    <section class="card">
      <h2>쿠폰 등록</h2>
      <textarea id="coupons" placeholder="쿠폰 코드 (여러 개는 줄바꿈·공백·콤마로 구분)"></textarea>
      <div class="row"><button id="runBtn">등록된 모든 계정에 등록</button></div>
      <p id="runMsg" class="muted"></p>
      <div id="results" class="res"></div>
    </section>

    <section class="card">
      <h2>등록된 계정 <span id="idCount" class="muted"></span></h2>
      <p id="noNameHint" class="muted hidden"></p>
      <table class="ids">
        <colgroup><col /><col style="width:118px" /><col class="c-act" /></colgroup>
        <thead><tr><th>아이디</th><th>CS 코드</th><th class="c-act"></th></tr></thead>
        <tbody id="idList"></tbody>
      </table>
      <textarea id="newIds" placeholder="한 줄에 하나: 아이디 CS코드 (예: 홍길동 12345678901)&#10;CS 코드만 써도 됩니다. 아이디가 없는 CS 코드에는 아이디를 붙일 수 있습니다." style="margin-top:10px"></textarea>
      <div class="row">
        <button id="addBtn">추가</button>
        <label class="file"><button type="button" class="ghost" id="xlsxBtn">엑셀로 추가</button></label>
        <input id="xlsx" type="file" accept=".xlsx,.xlsm" class="hidden" />
      </div>
      <p class="muted user-only">삭제와 아이디 변경은 아래 관리자 모드에서 할 수 있습니다.</p>
      <p class="muted">엑셀은 2행부터 A·B열을 읽습니다 (1행은 헤더). 숫자만 있는 칸을 CS 코드로, 다른 칸을 아이디로 봅니다.</p>
      <p id="idMsg" class="muted"></p>
    </section>

    <section class="card">
      <h2>서버</h2>
      <div class="row">
        <select id="server"></select>
        <button id="serverBtn" class="ghost admin-only" style="flex:0 0 auto">변경</button>
      </div>
      <p id="serverMsg" class="muted"></p>
    </section>

    <section class="card">
      <h2>관리자 <span class="badge admin-only">● 관리자 모드</span></h2>
      <form id="adminForm" class="row user-only">
        <input id="adminPw" type="password" autocomplete="off" placeholder="관리자 비밀번호" />
        <button type="submit" class="ghost" style="flex:0 0 auto">관리자 모드</button>
      </form>
      <p class="muted user-only">삭제, 아이디 변경, 서버 변경에 필요합니다.</p>
      <div class="row admin-only"><button id="adminOff" class="ghost">관리자 모드 끄기</button></div>
      <p id="adminMsg" class="muted"></p>
    </section>

    <button id="logout" class="ghost">로그아웃</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get() { try { return localStorage.getItem("pw") || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem("pw", v); } catch {} },
  clear() { try { localStorage.removeItem("pw"); } catch {} },
};
let pw = store.get();
// 관리자 비밀번호는 이 탭에서만 기억한다 (탭을 닫으면 잊음).
const adminStore = {
  get() { try { return sessionStorage.getItem("adminPw") || ""; } catch { return ""; } },
  set(v) { try { sessionStorage.setItem("adminPw", v); } catch {} },
  clear() { try { sessionStorage.removeItem("adminPw"); } catch {} },
};
let adminPw = adminStore.get();
function setAdmin(on, msg) {
  if (!on) { adminPw = ""; adminStore.clear(); if (editing.size) { editing.clear(); renderIds(lastIds); } }
  document.body.classList.toggle("admin", on);
  $("server").disabled = !on;
  if (msg !== undefined) $("adminMsg").textContent = msg;
}

async function api(path, body) {
  const res = await fetch("/api/" + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "X-Password": encodeURIComponent(pw),
               ...(adminPw ? { "X-Admin-Password": encodeURIComponent(adminPw) } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401) { showLogin(data.error || "비밀번호가 틀렸습니다."); throw new Error("unauthorized"); }
  if (res.status === 403) setAdmin(false);
  if (!res.ok) throw new Error(data.error || ("오류 " + res.status));
  return data;
}

const split = (s) => [...new Set(s.split(/[\s,]+/).map((x) => x.trim()).filter(Boolean))];
// CS 코드 = 숫자만 8자리 이상 (하이픈·공백 허용). 그 밖의 값은 아이디로 본다.
const csOf = (v) => { const t = String(v ?? "").trim(); return /^[\d\s-]+$/.test(t) && t.replace(/\D/g, "").length >= 8 ? t.replace(/\D/g, "") : ""; };
// 한 줄 → [{cs, name}]. "아이디 CS" / "CS 아이디" / "CS CS CS" 모두 받는다.
function parseLine(line) {
  const toks = line.split(/[\s,\t]+/).map((x) => x.trim()).filter(Boolean);
  if (!toks.length) return { entries: [] };
  const codes = toks.filter(csOf), rest = toks.filter((t) => !csOf(t));
  if (!codes.length) return { bad: line };
  if (!rest.length) return { entries: codes.map((t) => ({ cs: csOf(t), name: "" })) };
  if (codes.length > 1) return { bad: line };
  return { entries: [{ cs: csOf(codes[0]), name: rest.join(" ") }] };
}
let names = {};
const label = (cs, nm) => (nm ?? names[cs]) ? `${nm ?? names[cs]} (${cs})` : cs;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function showLogin(msg) {
  store.clear(); pw = "";
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("loginMsg").textContent = msg || "";
}

let lastIds = [];
const editing = new Set();   // 관리자가 "수정"을 누른 CS 코드
function nameCell(id) {
  const nm = names[id];
  if (!nm || editing.has(id)) {
    return `<div class="edit"><input data-name="${esc(id)}" value="${esc(nm || "")}" placeholder="아이디" maxlength="40" />`
      + `<button data-save="${esc(id)}">저장</button>`
      + (nm ? `<button class="ghost" data-cancel="${esc(id)}">취소</button>` : "") + `</div>`;
  }
  return `<b>${esc(nm)}</b> <button class="ghost admin-only" data-edit="${esc(id)}">수정</button>`;
}
function renderIds(ids, nm) {
  if (nm) names = nm;
  lastIds = ids;
  for (const id of [...editing]) if (!ids.includes(id) || !document.body.classList.contains("admin")) editing.delete(id);
  const empty = ids.filter((id) => !names[id]).length;
  $("idCount").textContent = `(${ids.length}개)`;
  $("noNameHint").textContent = `아이디가 빈 계정 ${empty}개 — 칸에 아이디를 쓰고 저장(또는 Enter)하거나, 엑셀/아래 입력칸으로 한꺼번에 넣을 수 있습니다.`;
  $("noNameHint").classList.toggle("hidden", !empty);
  $("idList").innerHTML = ids.length
    ? ids.map((id) => `<tr><td class="name">${nameCell(id)}</td><td class="cs">${esc(id)}</td>`
        + `<td class="c-act"><button class="ghost admin-only" data-id="${esc(id)}">삭제</button></td></tr>`).join("")
    : `<tr><td colspan="3" class="empty">등록된 계정이 없습니다.</td></tr>`;
}

async function saveName(id) {
  const input = document.querySelector(`#idList input[data-name="${CSS.escape(id)}"]`);
  const name = input ? input.value.trim() : "";
  if (!name) { $("idMsg").textContent = "아이디를 입력하세요."; input && input.focus(); return; }
  try {
    const r = await api("ids", { entries: [{ cs: id, name }] });
    if (r.locked && r.locked.length) { $("idMsg").textContent = "이미 있는 아이디를 바꾸려면 관리자 모드가 필요합니다."; return; }
    editing.delete(id);
    renderIds(r.ids, r.names);
    $("idMsg").textContent = `${label(id)} 저장됨`;
  } catch (e) { if (e.message !== "unauthorized") $("idMsg").textContent = e.message; }
}

async function loadAll() {
  const st = await api("state");
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  renderIds(st.ids, st.names || {});
  const sel = $("server");
  sel.innerHTML = `<option>${esc(st.server)}</option>`;
  try {
    const { servers } = await api("servers");
    sel.innerHTML = servers.map((s) => `<option ${s === st.server ? "selected" : ""}>${esc(s)}</option>`).join("");
  } catch (e) { $("serverMsg").textContent = "서버 목록을 못 불러왔습니다: " + e.message; }
  const saved = adminPw;
  setAdmin(false);
  if (saved) {
    adminPw = saved;
    try { await api("admin"); adminStore.set(saved); setAdmin(true, ""); } catch { setAdmin(false, ""); }
  }
}

$("adminForm").onsubmit = async (e) => {
  e.preventDefault();
  adminPw = $("adminPw").value;
  if (!adminPw) { $("adminMsg").textContent = "관리자 비밀번호를 입력하세요."; return; }
  try { await api("admin"); adminStore.set(adminPw); $("adminPw").value = ""; setAdmin(true, ""); }
  catch (err) { if (err.message !== "unauthorized") setAdmin(false, err.message); }
};
$("adminOff").onclick = () => setAdmin(false, "관리자 모드를 껐습니다.");

$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  pw = $("pw").value; store.set(pw);
  try { await loadAll(); $("loginMsg").textContent = ""; } catch (err) {
    if (err.message !== "unauthorized") $("loginMsg").textContent = err.message;
  }
};
$("logout").onclick = () => { setAdmin(false, ""); showLogin(""); };

$("runBtn").onclick = async () => {
  const codes = split($("coupons").value);
  if (!codes.length) { $("runMsg").textContent = "쿠폰 코드를 입력하세요."; return; }
  $("runBtn").disabled = true; $("results").innerHTML = "";
  let ok = 0, bad = 0;
  for (const [i, code] of codes.entries()) {
    $("runMsg").textContent = `진행 중… (${i + 1}/${codes.length}) ${code}`;
    try {
      const { results } = await api("coupon", { coupon: code });
      for (const r of results) {
        r.ok ? ok++ : bad++;
        $("results").insertAdjacentHTML("beforeend",
          `<div class="${r.ok ? "ok" : "bad"}">${r.ok ? "✅" : "❌"} <b>${esc(label(r.id, r.name || undefined))}</b> · ${esc(r.coupon)} — ${esc(r.msg || r.code)}</div>`);
      }
    } catch (e) {
      if (e.message === "unauthorized") break;
      bad++;
      $("results").insertAdjacentHTML("beforeend", `<div class="bad">❌ ${esc(code)} — ${esc(e.message)}</div>`);
    }
  }
  $("runMsg").textContent = `완료 — 성공 ${ok} / 실패 ${bad}`;
  $("runBtn").disabled = false;
};

async function addEntries(entries, prefix, bad) {
  const tail = bad && bad.length ? ` · 못 읽은 줄 ${bad.length}개: ${bad.slice(0, 3).join(" / ")}${bad.length > 3 ? " …" : ""}` : "";
  if (!entries.length) { $("idMsg").textContent = "추가할 CS 코드가 없습니다." + tail; return false; }
  const r = await api("ids", { entries });
  renderIds(r.ids, r.names);
  $("idMsg").textContent = `${prefix}추가 ${r.added.length}개`
    + (r.updated.length ? `, 아이디 변경 ${r.updated.length}개` : "")
    + (r.dupes.length ? `, 이미 있음 ${r.dupes.length}개` : "")
    + (r.locked && r.locked.length ? `, 아이디 변경은 관리자만 ${r.locked.length}개` : "") + tail;
  return !(bad && bad.length);
}

$("addBtn").onclick = async () => {
  const entries = [], bad = [];
  for (const line of $("newIds").value.split(/\n/)) {
    const p = parseLine(line);
    p.bad ? bad.push(p.bad.trim()) : entries.push(...p.entries);
  }
  try { if (await addEntries(entries, "", bad)) $("newIds").value = ""; }
  catch (e) { if (e.message !== "unauthorized") $("idMsg").textContent = e.message; }
};

$("idList").onkeydown = (e) => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.name) { e.preventDefault(); saveName(e.target.dataset.name); }
};
$("idList").onclick = async (e) => {
  const d = e.target.dataset || {};
  if (d.save) return saveName(d.save);
  if (d.edit) { editing.add(d.edit); renderIds(lastIds); const i = document.querySelector(`#idList input[data-name="${CSS.escape(d.edit)}"]`); i && i.focus(); return; }
  if (d.cancel) { editing.delete(d.cancel); renderIds(lastIds); return; }
  const id = d.id;
  if (!id || !confirm(`${label(id)} 를 삭제할까요?`)) return;
  const shown = label(id);
  try { const r = await api("ids", { remove: [id] }); renderIds(r.ids, r.names); $("idMsg").textContent = `${shown} 삭제됨`; }
  catch (err) { if (err.message !== "unauthorized") $("idMsg").textContent = err.message; }
};

$("xlsxBtn").onclick = () => $("xlsx").click();
$("xlsx").onchange = async () => {
  const f = $("xlsx").files[0]; if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer());
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
    const entries = [];
    let skipped = 0;
    for (const r of rows.slice(1)) {
      const a = r && r[0] != null ? String(r[0]).trim() : "", b = r && r[1] != null ? String(r[1]).trim() : "";
      if (!a && !b) continue;
      if (csOf(a)) entries.push({ cs: csOf(a), name: csOf(b) ? "" : b });
      else if (csOf(b)) entries.push({ cs: csOf(b), name: a });
      else skipped++;
    }
    await addEntries(entries, `엑셀 ${entries.length}건 인식${skipped ? ` (CS 코드 없는 행 ${skipped}개 건너뜀)` : ""} → `);
  } catch (e) { if (e.message !== "unauthorized") $("idMsg").textContent = "엑셀 읽기 실패: " + e.message; }
  $("xlsx").value = "";
};

$("serverBtn").onclick = async () => {
  try { const r = await api("server", { server: $("server").value }); $("serverMsg").textContent = `서버: ${r.server} 로 변경됨`; }
  catch (e) { if (e.message !== "unauthorized") $("serverMsg").textContent = e.message; }
};

if (pw) loadAll().catch((e) => { if (e.message !== "unauthorized") showLogin(e.message); });
</script>
</body>
</html>
